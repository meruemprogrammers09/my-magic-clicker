<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Серия Пенальти Pro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>⚽ Серия Пенальти</h1>

      <div class="settings">
        <label for="difficulty">Сложность вратаря:</label>
        <select id="difficulty">
          <option value="easy">Легко (Бот зевает)</option>
          <option value="medium">Нормально (Рандом)</option>
          <option value="hard" selected>Хардкор (Бот читает мысли)</option>
        </select>
      </div>

      <div class="scoreboard">
        <div>
          Вы (Игрок):
          <div id="player-score" class="score">0</div>
        </div>
        <div>
          <div>Серия ударов:</div>
          <div class="series-dots" id="dots-container">
            <div class="dot" id="dot-0"></div>
            <div class="dot" id="dot-1"></div>
            <div class="dot" id="dot-2"></div>
            <div class="dot" id="dot-3"></div>
            <div class="dot" id="dot-4"></div>
          </div>
        </div>
        <div>
          Бот (Вратарь):
          <div id="gk-score" class="score">0</div>
        </div>
      </div>

      <!-- Новый блок: Индикатор силы удара -->
      <div class="power-container">
        <label>Сила удара (Не бейте в красную зону!):</label>
        <div class="power-bar-wrapper">
          <div class="power-bar" id="power-bar"></div>
          <div class="power-zone"></div>
        </div>
      </div>

      <div class="pitch">
        <div class="goal">
          <div id="goalkeeper" class="goalkeeper">🧍‍♂️</div>
        </div>
        <div id="ball" class="ball"></div>
      </div>

      <div class="controls">
        <button onclick="kick('left')">Влево ←</button>
        <button onclick="kick('center')">По центру ↑</button>
        <button onclick="kick('right')">Вправо →</button>
      </div>

      <div id="result" class="result-text">Загрузка игры...</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
